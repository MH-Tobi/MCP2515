; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
  -I/include
  -I/lib/TestLibrary
  -L/include
  -L/lib/TestLibrary
lib_deps = D:\Projekte\Arduino\MCP2515\TestMCP2515\lib\TestLibrary
lib_extra_dirs = 
	D:\Projekte\Arduino\MCP2515
  D:\Projekte\Arduino\MCP2515\TestMCP2515\lib\TestLibrary

[env:micro]
platform = atmelavr
board = micro
framework = arduino
monitor_speed = 115200
build_flags =
  -I/include
  -I/lib/TestLibrary
  -L/include
  -L/lib/TestLibrary
lib_deps = D:\Projekte\Arduino\MCP2515\TestMCP2515\lib\TestLibrary
lib_extra_dirs =
  D:\Projekte\Arduino\MCP2515
  D:\Projekte\Arduino\MCP2515\TestMCP2515\lib\TestLibrary